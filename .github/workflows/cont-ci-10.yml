name: cont-ci-10

on:
  workflow_dispatch:
    inputs:
      TagVersion:
        description: 'Tag version for Docker image'
        required: true
        default: 'v1.1.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      IMAGE_NAME: ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.EDUUSERID }}/samplejava

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        
        with:
          path: /tmp/docker-image-cache.tar
          key: docker-cache-${{ github.ref_name }}
          restore-keys: |
            docker-cache-
      
        #with:
        #  path: /tmp/.buildx-cache
        #  key: ${{ runner.os }}-buildx-${{ github.sha }}
        #  restore-keys: |
        #    ${{ runner.os }}-buildx-
            
      - name: Load cache if exists
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit - loading image cache..."
          docker load -i /tmp/docker-image-cache.tar || true

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.event.inputs.TagVersion }} .

      - name: Upload Docker image to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v1
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag  ${{ env.IMAGE_NAME }}:${{ github.event.inputs.TagVersion }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.event.inputs.TagVersion }}
          docker push ${{ env.IMAGE_NAME }}:latest
          
      - name: Save cache
        run: |
          echo "Saving Docker image cache..."
          docker save ${{ env.IMAGE_NAME }}:${{ github.event.inputs.TagVersion }} -o /tmp/docker-image-cache.tar
    
